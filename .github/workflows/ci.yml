name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  tests:
    runs-on: ubuntu-latest
    environment: CI
    services:
      cosmwasm-etl-db:
        image: postgres:16 # ratchet:exclude
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: appPW
          POSTGRES_DB: cosmwasm_etl
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Run Golang linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # ratchet:golangci/golangci-lint-action@v9

      - name: Build all
        run: make build-all

      - name: Tests
        shell: bash
        run: |
          echo "${{ secrets.CONFIG }}" > config.yaml
          go test -short -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # ratchet:codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out

      - name: Migration Tests
        run: |
          make parser-migrate-up
          make parser-migrate-test
          # aggregator migrations run against the tables parser creates, so they go
          # between the parser up and down. Their down steps back one migration, and
          # the second up proves what it left behind can be migrated again.
          make aggregator-migrate-up
          make aggregator-migrate-down
          make aggregator-migrate-up
          make parser-migrate-down

  docker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Get changed files
        id: changed
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # ratchet:dorny/paths-filter@v4
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'go.mod'
              - 'go.sum'

      - name: Validate Dockerfile (syntax check)
        run: docker build --check --build-arg APP_PATH=parser/dex .

      - name: Full build check (Dockerfile/go.mod changed)
        if: steps.changed.outputs.docker == 'true'
        env:
          APP_PATH: parser/dex
        run: make image
